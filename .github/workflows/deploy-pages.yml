name: Deploy Absent Note Converter to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run converter tests
        run: pnpm --filter @workspace/absent-note-converter run test

      - name: Typecheck converter
        run: pnpm --filter @workspace/absent-note-converter run typecheck

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build project site
        run: pnpm --filter @workspace/absent-note-converter run build
        env:
          PORT: 4173
          BASE_PATH: /absent-note/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/absent-note-converter/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
